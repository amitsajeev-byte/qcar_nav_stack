controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_linear_distance: 0.1
      required_angular_distance: 0.1
      movement_time_allowance: 30.0
    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.12
      yaw_goal_tolerance: 0.3
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 56
      model_dt: 0.05
      batch_size: 2000
      vx_std: 0.2
      vy_std: 0.0
      wz_std: 0.4
      vx_max: 0.3
      # Negative - allows reversing, matching this vehicle's real reverse capability. Magnitude
      # kept below vx_max since the plugin's own PID/physics were only tuned/verified for
      # forward speeds up to 0.3 m/s.
      vx_min: -0.2
      vy_max: 0.0
      wz_max: 1.9
      iteration_count: 2
      prune_distance: 1.0
      transform_tolerance: 0.1
      temperature: 0.3
      gamma: 0.015
      motion_model: "Ackermann"
      visualize: true
      enforce_path_inversion: true
      inversion_xy_tolerance: 0.2
      inversion_yaw_tolerance: 0.4
      AckermannConstraints:
        min_turning_r: 0.5
      # PreferForwardCritic is deliberately NOT in this list: it penalizes any reverse velocity
      # while the robot is more than its own threshold_to_consider from the goal, which fights a
      # K-turn's reversal segment even when the plan itself already decided reversing is needed.
      # This vehicle genuinely needs to reverse - discouraging unnecessary reversing belongs at
      # the planning level instead (see planner_server.GridBased.reverse_penalty below), not by
      # fighting a reverse the plan has already committed to.
      critics: ["ConstraintCritic", "CostCritic", "GoalCritic", "GoalAngleCritic",
                "PathAlignCritic", "PathFollowCritic", "PathAngleCritic",
                "EarlyCommitCritic"]
      EarlyCommitCritic:
        offset_from_furthest: 3
        early_time_steps: 10
        max_lead_distance: 0.3
        forward_preference: false
        cost_weight: 15.0
      CostCritic:
        consider_footprint: true
      GoalCritic:
        cost_weight: 8.0
      GoalAngleCritic:
        cost_weight: 10.0
      PathFollowCritic:
        threshold_to_consider: 0.15
        offset_from_furthest: 6
      PathAngleCritic:
        offset_from_furthest: 4
      PathAlignCritic:
        offset_from_furthest: 3
        threshold_to_consider: 0.15
        cost_weight: 10.0

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["cusp_straightener"]
    # simple_smoother is configured here but not wired into the active behavior tree (no
    # <SmoothPath> node call targets it) - left available as an alternative, unused smoother.
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true
    cusp_straightener:
      plugin: "qcar_gazebo::smoothers::CuspStraightenerSmoother"
      straight_distance: 0.21
      extend_distance: 0.15
      min_lead_distance: 0.3

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: false
    planner_plugins: ["GridBased"]
    GridBased:
      # SmacPlannerHybrid (not NavfnPlanner): kinematically aware of this Ackermann car's real
      # minimum turning radius and, with motion_model_for_search: "REEDS_SHEPP", can plan an
      # explicit reverse/K-turn segment into the path itself when the goal orientation can't be
      # reached by a forward-only arc. NavfnPlanner has no concept of heading at all, so it
      # would hand FollowPath a path whose arrival tangent could be wildly different from the
      # requested goal orientation, leaving the controller to improvise a correction reactively.
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      downsample_costmap: false
      downsampling_factor: 1
      tolerance: 0.5
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 5.0
      # Reversing is enabled (this vehicle needs real reverse/K-turn capability for large
      # final-heading changes), paired with a conservative FollowPath configuration (smaller
      # lookahead distances, slower cusp approach - see controller_server.FollowPath above)
      # aimed at making the cusp transition itself stable.
      motion_model_for_search: "REEDS_SHEPP"
      angle_quantization_bins: 72
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0
      minimum_turning_radius: 0.8
      reverse_penalty: 4.0
      change_penalty: 3.0
      non_straight_penalty: 1.2
      cost_penalty: 2.0
      retrospective_penalty: 0.025
      lookup_table_size: 20.0
      cache_obstacle_heuristic: false
      smooth_path: true

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base
      use_sim_time: false
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      footprint: "[[0.22, 0.09], [0.22, -0.09], [-0.22, -0.09], [-0.22, 0.09]]"
      plugins: ["voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: true
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base
      use_sim_time: false
      # See local_costmap's footprint above - same polygon, kept in sync.
      footprint: "[[0.22, 0.09], [0.22, -0.09], [-0.22, -0.09], [-0.22, 0.09]]"
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      always_send_full_costmap: true

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: false
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait", "assisted_teleop"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: odom
    robot_base_frame: base
    transform_timeout: 0.1
    use_sim_time: false
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.3, 0.0, 1.0]
    min_velocity: [-0.3, 0.0, -1.0]
    max_accel: [1.5, 0.0, 2.0]
    max_decel: [-1.5, 0.0, -2.0]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

lifecycle_manager:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names:
      - map_server
      - amcl
      - controller_server
      - smoother_server
      - planner_server
      - behavior_server
      - bt_navigator
      - waypoint_follower
      - velocity_smoother
